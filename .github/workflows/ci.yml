name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
      # ngspice for the RC known-answer integration test (local environment).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ngspice
      # The KLayout Python module for the tests of the klayout operations query and diff (they are skipped without it).
      - run: python3 -m pip install --user --break-system-packages klayout==0.30.12
      - run: npm ci
      - run: npm test
